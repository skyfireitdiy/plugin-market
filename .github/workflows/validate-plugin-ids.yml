---
name: Validate Plugin IDs

# 检测 plugins/ 目录下所有插件清单：id 唯一性、文件名=id、配置格式、
# repo URL 可达性（git ls-remote 验证仓库与分支存在）。
# 触发时机：PR（含 PR 内 push）+ 推送到 main，保证合并前后都校验。

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin IDs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate plugins (format + unique ids + repo reachability)
        run: python scripts/validate_plugins.py
