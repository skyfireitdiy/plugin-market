# Jarvis 插件市场清单
#
# 本文件是 Jarvis 插件市场的结构化清单，机器可读，供 Jarvis 客户端解析、展示与安装。
# 客户端通过配置项 `plugin_market_repo` 指向本仓库，拉取本清单后浏览并安装插件。
#
# 设计原则：**不记录经常变更的信息**（如版本号）。
# 版本号变动频繁，若写入本清单，每次发版都需同步修改，维护成本高。
# 客户端从插件仓库本身获取最新版本（git 分支 HEAD / tag），本清单只维护相对稳定的元数据。
#
# 字段说明：
#   id           插件唯一标识（建议与插件 config.yaml 的 name 一致，防同名冲突）
#   name         插件展示名
#   description  插件功能说明
#   repo         插件源码仓库地址（git 仓库，支持 https://github.com/owner/repo 或 git@host:owner/repo.git）
#   branch       插件发布所用的 git 分支（默认 main）
#   author       插件作者（溯源）
#   license      开源协议（合规性）
#   categories   分类/标签（便于检索），可选
#
# 如何提交插件到市场：
#   1. 在下方 plugins 列表新增一条记录（字段见上）
#   2. 创建 Pull Request 到本仓库，经审核后合并
#   3. 合并后客户端拉取本清单即可看到该插件
#
# 注意：依赖声明（其他插件/Python 包/系统命令）请写在插件自身的 config.yaml 的
# `dependencies` 字段，不要写进本清单，避免重复维护。

plugins: []
