id: rea
name: REA 逆向工程
description: 基于 REA（Reverse Engineer Anything）的逆向工程集成插件：一键配置 REA 环境（先询问逆向目标再按需安装配套工具）、多节点批量部署、MCP 自动注册，让 Agent 具备二进制/应用/运行时逆向分析能力。
repo: https://github.com/skyfireitdiy/jarvis-plugin-rea
branch: main
author: skyfire
license: MIT
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e3a5f"/>
        <stop offset="100%" stop-color="#0d1b2a"/>
      </linearGradient>
      <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4fc3f7"/>
        <stop offset="100%" stop-color="#0288d1"/>
      </linearGradient>
    </defs>
    <!-- 圆角背景 -->
    <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
    <!-- 放大镜镜片（逆向/分析主题） -->
    <circle cx="56" cy="56" r="32" fill="none" stroke="url(#lens)" stroke-width="10"/>
    <!-- 放大镜手柄 -->
    <line x1="80" y1="80" x2="104" y2="104" stroke="url(#lens)" stroke-width="12" stroke-linecap="round"/>
    <!-- 镜片内的二进制代码线条（反汇编风格） -->
    <g stroke="#a5d6a7" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="38" y1="48" x2="74" y2="48"/>
      <line x1="44" y1="60" x2="68" y2="60"/>
      <line x1="40" y1="72" x2="72" y2="72"/>
    </g>
    <!-- 镜片内的小圆点（断点/地址标记） -->
    <circle cx="38" cy="48" r="4" fill="#ff8a65"/>
    <circle cx="44" cy="60" r="4" fill="#ffd54f"/>
    <circle cx="40" cy="72" r="4" fill="#81d4fa"/>
  </svg>
categories:
  - security
  - reverse-engineering
  - dev
