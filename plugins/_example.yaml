# 插件市场条目模板（示例）
#
# 本文件是插件市场条目的模板/示例。提交真实插件到市场时：
#   1. 复制本文件为 <plugin-id>.yaml（文件名 = 插件 id）
#   2. 填写下方字段
#   3. 创建 Pull Request 到 plugin-market 仓库
#
# 字段说明：
#   id           插件唯一标识（建议与插件 config.yaml 的 name 一致，防同名冲突）
#   name         插件展示名
#   description  插件功能说明
#   repo         插件源码仓库地址（git 仓库，支持 https://github.com/owner/repo 或 git@host:owner/repo.git）
#   branch       插件发布所用的 git 分支（默认 main）
#   author       插件作者（溯源）
#   license      开源协议（合规性）
#   categories   分类/标签（便于检索），可选
#
# 注意：不记录版本号（客户端从插件仓库本身获取最新版本）。
# 依赖声明请写在插件自身 config.yaml 的 dependencies 字段，不要写进本文件。

id: my-plugin
name: 我的插件
description: 插件功能说明。
repo: https://github.com/owner/my-plugin
branch: main
author: your-name
license: MIT
categories:
  - tool
  - dev
