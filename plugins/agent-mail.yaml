id: agent-mail
name: Agent Mail
description: >-
  Agent Mail——接入腾讯 QQ 邮箱 AI Agent 专属邮箱服务（agently-cli），
  支持后台监听新邮件、前端收发/搜索/回复邮件、按预定义规则自动派发 Agent 处理
  （可配置自动回复、白名单与三档处理模式）。
