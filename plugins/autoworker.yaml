id: autoworker
name: AutoWorker 任务管理
description: AutoWorker 任务管理——把一批任务组织在后端工作目录下，通过编辑器左侧「任务」面板管理，支持「创建 Agent 执行任务」+「Agent 调用任务管理工具」双通道，任务状态持久化到各任务子目录的 .jarvis/autoworker。
repo: https://github.com/skyfireitdiy/jarvis-plugin-autoworker
branch: main
author: skyfire
