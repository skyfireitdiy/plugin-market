id: stock-predictor
name: A股中短线预测
description: >-
  提供 A 股个股的结构化数据面板：日K与均线/MACD/RSI/BOLL 等技术指标、
  盘中实时走势（VWAP/日内位置/量比/动量）、主力资金、涨停情绪、大盘环境、
  新闻、两融与北向、限售解禁。只呈现客观数据不做预测，可一键把数据交给
  Agent 从多维角度分析。
